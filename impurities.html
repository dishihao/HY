<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#222222">
  <meta name="description" content="杂质测定关键表格与计算页面。">
  <title>杂质测定计算</title>
  <link rel="stylesheet" href="lab-pages.css?v=20260725-2">
  <link rel="stylesheet" href="formula-substitution.css?v=20260725-1">
</head>
<body data-method="impurities" data-unit="%" data-project="杂质">
  <header class="toolbar no-print">
    <div class="toolbar-title">杂质测定计算</div>
    <div class="toolbar-actions">
      <a class="btn" href="index.html">项目首页</a>
      <button class="btn" id="exampleBtn" type="button">载入纸面示例</button>
      <button class="btn" id="copyBtn" type="button">复制结果</button>
      <button class="btn" id="printBtn" type="button">打印 / 保存PDF</button>
      <button class="btn" id="resetBtn" type="button">清空数据</button>
    </div>
  </header>

  <main class="app-shell">
    <article class="paper">
      <h1 class="record-title">【检查】杂质</h1>

      <section class="section">
        <h2 class="section-title">数据记录与计算</h2>
        <div class="table-scroll">
          <table class="record-table">
            <colgroup><col class="label-col"><col class="value-col"><col class="value-col"></colgroup>
            <thead><tr><th>样品编号</th><th><input class="entry" data-field="sampleNo1" value="1"></th><th><input class="entry" data-field="sampleNo2" value="2"></th></tr></thead>
            <tbody>
              <tr><th>样品重量 M<sub>总</sub>（g）</th><td><input class="entry" data-field="sampleMass1" data-number inputmode="decimal"></td><td><input class="entry" data-field="sampleMass2" data-number inputmode="decimal"></td></tr>
              <tr><th>杂质重量 M<sub>1</sub>（g）</th><td><input class="entry" data-field="impurityMass1" data-number inputmode="decimal"></td><td><input class="entry" data-field="impurityMass2" data-number inputmode="decimal"></td></tr>
              <tr class="result-row"><th>杂质含量 X（%）</th><td><input id="result1" class="output" readonly value="—"></td><td><input id="result2" class="output" readonly value="—"></td></tr>
              <tr class="result-row"><th>相对偏差（%）</th><td colspan="2"><input id="relativeDeviation" class="output wide-output" readonly value="—"></td></tr>
              <tr class="result-row"><th>杂质平均含量 X̄（%）</th><td colspan="2"><input id="average" class="output wide-output" readonly value="—"></td></tr>
            </tbody>
          </table>
        </div>

        <div class="formula-box">X ＝ M<sub>1</sub> ÷ M<sub>总</sub> × 100%</div>
        <div class="result-lines">
          <div class="result-line"><span>X₁＝</span><strong id="summary1">—</strong><span>%</span></div>
          <div class="result-line"><span>X₂＝</span><strong id="summary2">—</strong><span>%</span></div>
          <div class="result-line"><span>相对偏差＝</span><strong id="summaryRd">—</strong><span>%</span></div>
          <div class="result-line"><span>平均含量＝</span><strong id="summaryAvg">—</strong><span>%</span></div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">标准规定与结果</h2>
        <div class="standard-grid"><span>标准规定：</span><select class="entry-select" data-field="relation"><option value="max">不得过</option><option value="min">不得少于</option></select><input class="entry" data-field="spec" data-number inputmode="decimal" value="3"><span>%</span></div>
        <div class="standard-grid standard-text-row"><span>标准文字：</span><input id="standardText" class="output" readonly value="请输入标准规定。"></div>
        <div class="rounding-note">采用“四舍六入五成双”。单份结果比标准规定多保留1位小数；相对偏差按已修约的X₁、X₂计算；平均值与标准规定保留相同小数位。</div>
        <div class="status-row"><div>测定结果：<span id="resultStatus" class="status pending">待输入</span></div><div class="conclusion">结论：本品杂质测定结果 <span id="overallStatus" class="status pending">待输入</span>。</div></div>
      </section>
    </article>
  </main>

  <div id="toast" class="toast"></div>
  <script src="lab-common.js?v=20260725-3"></script>
  <script src="formula-substitution.js?v=20260725-1"></script>
</body>
</html>
